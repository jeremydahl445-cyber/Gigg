<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Myles</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow-x: hidden;
    }
    body {
      background-color: #1a1a2e;
      background-image: url("images/55a47e7e92a6616ffefc18cf5157fcd24e55179a5bcb82884c7d28a52218ec3a24767f620d3512135169fe67f5048493a256d289e3c00d9f9efee7_1280.jpg");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }
    .canvas {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px; padding: 10px;
      width: 100%;
    }
    @media (max-width: 480px) {
      .canvas { grid-template-columns: 1fr; }
    }
    .canvas > * { aspect-ratio: 1 / 1; width: 100%; }
    .grid-img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.35);
      display: block;
    }
    #cell-bottomright { position: relative; display: flex; flex-direction: column; border-radius: 12px; }
    #dragImg {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.35);
      cursor: grab;
      position: relative;
      z-index: 10;
    }
    #dragImg.dragging {
      cursor: grabbing;
      box-shadow: 0 12px 40px rgba(0,0,0,0.55);
      position: fixed;
      z-index: 9999;
      pointer-events: none;
    }
    #secretBox {
      display: none; position: absolute; inset: 0;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(6px);
      border-radius: 12px; z-index: 5;
    }
    #secretBox.visible { display: flex; }
    #secretInput {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 10px; color: white;
      padding: 10px; width: 90%;
      text-align: center; outline: none;
      font-size: clamp(12px, 2vw, 16px);
    }

    /* ── Rare reveal overlay ── */
    #rareReveal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99998;
      background: #000;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }
    #rareReveal.visible {
      display: flex;
    }
    #rareRevealText {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(28px, 5vw, 64px);
      font-weight: bold;
      letter-spacing: 0.08em;
      text-align: center;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
    }

    /* ── Dih Sean floating words ── */
    .dih-sean-word {
      position: fixed;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      pointer-events: none;
      z-index: 99999;
      color: #ff0080;
      text-shadow: 0 0 20px #ff0080, 0 0 60px #ff0080, 0 0 120px #ff0080;
    }

    /* Animations */
    @keyframes rainbowCycle {
      0%   { filter: hue-rotate(0deg) saturate(5) brightness(1.2) drop-shadow(0 0 15px white); }
      100% { filter: hue-rotate(360deg) saturate(5) brightness(1.2) drop-shadow(0 0 15px white); }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes platinumShimmer {
      0%, 100% { filter: grayscale(1) brightness(1.2) contrast(1.2) drop-shadow(0 0 10px #e5e4e2); }
      50%       { filter: grayscale(1) brightness(2)   contrast(1.5) drop-shadow(0 0 30px #ffffff); }
    }
    @keyframes diamondShimmer {
      0%, 100% { filter: brightness(1.2) saturate(3) hue-rotate(195deg) drop-shadow(0 0 20px #aaddff); }
      50%       { filter: brightness(1.6) saturate(4) hue-rotate(195deg) drop-shadow(0 0 40px #cceeff); }
    }
    @keyframes emeraldShimmer {
      0%, 100% { filter: brightness(1.2) saturate(3) hue-rotate(120deg) drop-shadow(0 0 20px #88ffaa); }
      50%       { filter: brightness(1.6) saturate(4) hue-rotate(120deg) drop-shadow(0 0 40px #aaffcc); }
    }
    @keyframes redShimmer {
      0%, 100% { filter: sepia(1) saturate(8)  hue-rotate(290deg) brightness(1.3) drop-shadow(0 0 12px #ff2200); }
      50%       { filter: sepia(1) saturate(15) hue-rotate(300deg) brightness(1.8) drop-shadow(0 0 35px #ff6644); }
    }
    @keyframes godlyShimmer {
      0%   { filter: brightness(1.5) saturate(3) hue-rotate(45deg) drop-shadow(0 0 30px #ffee88); }
      50%  { filter: brightness(2.5) saturate(0) hue-rotate(45deg) drop-shadow(0 0 70px #ffffff); }
      100% { filter: brightness(1.5) saturate(3) hue-rotate(45deg) drop-shadow(0 0 30px #ffee88); }
    }
    @keyframes galaxyShimmer {
      0%   { filter: brightness(1.4) saturate(6) hue-rotate(270deg) drop-shadow(0 0 25px #9933ff); }
      50%  { filter: brightness(2.2) saturate(2) hue-rotate(270deg) drop-shadow(0 0 70px #ffffff); }
      100% { filter: brightness(1.4) saturate(6) hue-rotate(270deg) drop-shadow(0 0 25px #9933ff); }
    }
    @keyframes dihSeanFloat {
      0%   { transform: translate(0, 0) rotate(0deg); }
      25%  { transform: translate(var(--dx1), var(--dy1)) rotate(var(--dr1)); }
      50%  { transform: translate(var(--dx2), var(--dy2)) rotate(var(--dr2)); }
      75%  { transform: translate(var(--dx3), var(--dy3)) rotate(var(--dr3)); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }
  </style>
</head>
<body>
  <div class="canvas">
    <img class="grid-img" src="arlo.png"          alt="Arlo">
    <img class="grid-img" src="BDOGREAL.JPEG"     alt="Butterdog">
    <img class="grid-img" src="arlo.gif"          alt="Arlo gif">
    <img class="grid-img" src="BDOGS2.JPEG"       alt="B Dogs">
    <img class="grid-img" src="MADDIE.JPEG"       alt="Maddie">
    <img class="grid-img" src="CHICKEN.JPEG"      alt="Chicken">
    <img class="grid-img" src="COOPER.JPEG"       alt="Cooper">
    <img class="grid-img" src="BENCAT1.JPEG"      alt="Ben Cat 1">
    <img class="grid-img" src="BENCAT2.JPEG"      alt="Ben Cat 2">
    <img class="grid-img" src="BENDOG.JPEG"       alt="Ben Dog">
    <img class="grid-img" src="BENDOG2.png"       alt="Ben Dog 2">
    <div id="cell-bottomright">
      <div id="secretBox">
        <input id="secretInput" type="text" placeholder="enter code..." autocomplete="off" />
      </div>
      <img id="dragImg" src="EVANDOGREAL.JPEG" alt="Evan Dog">
    </div>
  </div>

  <!-- Rare reveal overlay -->
  <div id="rareReveal">
    <div id="rareRevealText"></div>
  </div>

  <script>
    // ── Drag logic ──────────────────────────────────────────────────────────────
    const dragImg     = document.getElementById("dragImg");
    const secretBox   = document.getElementById("secretBox");
    const secretInput = document.getElementById("secretInput");
    let isDragging = false, startX, startY;

    dragImg.addEventListener("mousedown", (e) => {
      isDragging = true;
      const rect = dragImg.getBoundingClientRect();
      startX = e.clientX - rect.left;
      startY = e.clientY - rect.top;

      dragImg.style.width  = rect.width  + "px";
      dragImg.style.height = rect.height + "px";
      dragImg.style.left   = rect.left   + "px";
      dragImg.style.top    = rect.top    + "px";

      dragImg.classList.add("dragging");
      secretBox.classList.add("visible");
      e.preventDefault();
    });

    document.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      dragImg.style.left = (e.clientX - startX) + "px";
      dragImg.style.top  = (e.clientY - startY) + "px";
    });

    document.addEventListener("mouseup", () => {
      if (!isDragging) return;
      isDragging = false;
      dragImg.style.position = "fixed";
      dragImg.classList.remove("dragging");
    });

    // ── Sound helper ────────────────────────────────────────────────────────────
    function playRareSound() {
      const audio = new Audio('https://fesliyanstudios.com');
      audio.volume = 0.5;
      audio.play().catch(() => {});
    }

    // ── Reveal overlay config per effect ────────────────────────────────────────
    const REVEAL_CONFIG = {
      galaxy:   { color: "#9933ff", glow: "#9933ff" },
      godly:    { color: "#ffee88", glow: "#ffee88" },
      red:      { color: "#ff3300", glow: "#ff3300" },
      emerald:  { color: "#88ffaa", glow: "#88ffaa" },
      platinum: { color: "#e8e8e8", glow: "#ffffff" },
      diamond:  { color: "#aaddff", glow: "#aaddff" },
      rainbow:  { color: "#ffffff", glow: "#ffffff" },
      gold:     { color: "#ffd700", glow: "#ffd700" },
    };

    // ── Effect/type display names ────────────────────────────────────────────────
    const EFFECT_NAMES = {
      galaxy: "Galaxy", godly: "Godly", red: "Red", emerald: "Emerald",
      platinum: "Platinum", diamond: "Diamond", rainbow: "Rainbow", gold: "Gold", normal: "Normal"
    };
    const TYPE_NAMES = { large: "Large", spinning: "Spinning", normal: "" };

    // ── Odds tables ──────────────────────────────────────────────────────────────
    const EFFECT_ODDS = {
      galaxy: 5000, godly: 2500, red: 1500, emerald: 1000,
      platinum: 500, diamond: 200, rainbow: 100, gold: 15, normal: 1
    };
    const TYPE_ODDS = { large: 850, spinning: 150, normal: 1 };

    // ── Rare reveal function ─────────────────────────────────────────────────────
    // Only shows if combined odds > 1/999 (i.e. combinedOdds > 999)
    function showRareReveal(effect, type, overrideLabel, overrideColor, overrideGlow) {
      const effectOdds = EFFECT_ODDS[effect] || 1;
      const typeOdds   = type !== "normal" ? TYPE_ODDS[type] : 1;
      const combinedOdds = effectOdds * typeOdds;

      if (!overrideLabel && combinedOdds <= 999) return;

      // Build label: "Gold Spinning", "Gold Large", "Galaxy", "Platinum", etc.
      let label;
      if (overrideLabel) {
        label = overrideLabel;
      } else {
        const effectName = EFFECT_NAMES[effect] || effect;
        const typeName   = type !== "normal" ? TYPE_NAMES[type] : "";
        label = typeName ? `${effectName} ${typeName}` : effectName;
      }

      const cfg = REVEAL_CONFIG[effect] || { color: "#ffffff", glow: "#ffffff" };
      const color = overrideColor || cfg.color;
      const glow  = overrideGlow  || cfg.glow;

      const overlay = document.getElementById("rareReveal");
      const text    = document.getElementById("rareRevealText");

      text.textContent = label;
      text.style.color      = color;
      text.style.textShadow = `0 0 20px ${glow}, 0 0 60px ${glow}, 0 0 120px ${glow}`;
      overlay.style.boxShadow = `inset 0 0 120px 40px ${glow}`;

      overlay.style.transition = "opacity 0.25s ease";
      overlay.style.opacity = "0";
      overlay.classList.add("visible");
      overlay.getBoundingClientRect();
      overlay.style.opacity = "1";

      setTimeout(() => {
        overlay.style.transition = "opacity 1s ease";
        overlay.style.opacity = "0";
        setTimeout(() => {
          overlay.classList.remove("visible");
          overlay.style.boxShadow = "";
        }, 1000);
      }, 2000);
    }

    // ── Dih Sean floating words ──────────────────────────────────────────────────
    function spawnDihSeanWords() {
      const phrases = ["DIH", "SEAN"];
      const colors  = ["#ff0080", "#ff00ff", "#ff4400", "#ff0044", "#cc00ff"];

      for (let i = 0; i < 18; i++) {
        const el = document.createElement("div");
        el.classList.add("dih-sean-word");
        el.textContent = phrases[Math.floor(Math.random() * phrases.length)];

        const size = Math.floor(Math.random() * 80) + 40;
        el.style.fontSize = size + "px";

        const color = colors[Math.floor(Math.random() * colors.length)];
        el.style.color = color;
        el.style.textShadow = `0 0 20px ${color}, 0 0 60px ${color}`;

        const startLeft = Math.random() * (window.innerWidth - 200);
        const startTop  = Math.random() * (window.innerHeight - 100);
        el.style.left = startLeft + "px";
        el.style.top  = startTop  + "px";

        // Random movement deltas for keyframe animation
        const randDelta = () => (Math.random() - 0.5) * 600;
        const randRot   = () => (Math.random() - 0.5) * 720;
        el.style.setProperty("--dx1", randDelta() + "px");
        el.style.setProperty("--dy1", randDelta() + "px");
        el.style.setProperty("--dr1", randRot()   + "deg");
        el.style.setProperty("--dx2", randDelta() + "px");
        el.style.setProperty("--dy2", randDelta() + "px");
        el.style.setProperty("--dr2", randRot()   + "deg");
        el.style.setProperty("--dx3", randDelta() + "px");
        el.style.setProperty("--dy3", randDelta() + "px");
        el.style.setProperty("--dr3", randRot()   + "deg");

        const duration = (Math.random() * 3 + 2).toFixed(1);
        el.style.animation = `dihSeanFloat ${duration}s ease-in-out infinite`;

        document.body.appendChild(el);
      }
    }

    // ── Shared roll helper ───────────────────────────────────────────────────────
    function spawnRolledImage(src, isWide, blendMode, isSean, sizeMultiplier = 1) {
      const newImg = document.createElement("img");
      newImg.src = src;
      newImg.style.position = "absolute";
      newImg.style.zIndex   = "10000";

      if (blendMode) newImg.style.mixBlendMode = blendMode;

      // ── "Dih Sean" exclusive 1/10000 roll (Sean only) ──
      if (isSean && Math.random() < 1 / 10000) {
        // Show announcement in huge font
        const overlay = document.getElementById("rareReveal");
        const text    = document.getElementById("rareRevealText");
        text.textContent = "DIH SEAN";
        text.style.fontSize = "clamp(60px, 12vw, 140px)";
        text.style.color = "#ff0080";
        text.style.textShadow = "0 0 20px #ff0080, 0 0 60px #ff0080, 0 0 120px #ff0080, 0 0 200px #ff0080";
        overlay.style.boxShadow = "inset 0 0 120px 40px #ff0080";
        overlay.style.transition = "opacity 0.25s ease";
        overlay.style.opacity = "0";
        overlay.classList.add("visible");
        overlay.getBoundingClientRect();
        overlay.style.opacity = "1";

        setTimeout(() => {
          overlay.style.transition = "opacity 1s ease";
          overlay.style.opacity = "0";
          setTimeout(() => {
            overlay.classList.remove("visible");
            overlay.style.boxShadow = "";
            text.style.fontSize = "";
            // Spawn the persistent floating words AFTER the overlay fades
            spawnDihSeanWords();
          }, 1000);
        }, 2500);

        playRareSound();

        // Still spawn the image too
        newImg.style.width = "800px";
        newImg.style.animation = "spin 0.5s linear infinite";
        const maxLeft = Math.max(0, window.innerWidth  - 800);
        const maxTop  = Math.max(0, window.innerHeight - 800);
        newImg.style.left = (Math.random() * maxLeft) + "px";
        newImg.style.top  = (Math.random() * maxTop + window.scrollY) + "px";
        document.body.appendChild(newImg);
        return;
      }

      const effectOrder = ["galaxy", "godly", ...(isSean ? ["red"] : []), "emerald", "platinum", "diamond", "rainbow", "gold"];
      let effect = "normal";
      const effectRoll = Math.random();
      let cumulative = 0;
      for (const e of effectOrder) {
        cumulative += 1 / EFFECT_ODDS[e];
        if (effectRoll < cumulative) { effect = e; break; }
      }

      let type = "normal";
      const typeRoll = Math.random();
      if      (typeRoll < 1 / TYPE_ODDS.large)                                 type = "large";
      else if (typeRoll < 1 / TYPE_ODDS.large + 1 / TYPE_ODDS.spinning)        type = "spinning";

      showRareReveal(effect, type);

      const effectSize = {
        galaxy:   isWide ? 5000 : 1800,
        godly:    isWide ? 4500 : 1600,
        red:      isWide ? 2400 : 800,
        emerald:  isWide ? 2800 : 900,
        platinum: isWide ? 2000 : 600,
        diamond:  isWide ? 1100 : 550,
        rainbow:  isWide ? 1000 : 500,
        gold:     650,
        normal:   isWide ? 300  : 450,
      }[effect];

      const typeSize = {
        large:    3500,
        spinning: isWide ? 1400 : 800,
        normal:   0,
      }[type];

      let size = Math.round(Math.max(effectSize, typeSize) * sizeMultiplier);

      const animations = [];

      if (effect === "galaxy") {
        animations.push("galaxyShimmer 2s ease-in-out infinite");
      } else if (effect === "godly") {
        animations.push("godlyShimmer 0.8s ease-in-out infinite");
      } else if (effect === "red") {
        animations.push("redShimmer 1.5s ease-in-out infinite");
      } else if (effect === "emerald") {
        animations.push("emeraldShimmer 1.4s ease-in-out infinite");
      } else if (effect === "platinum") {
        animations.push("platinumShimmer 1.5s ease-in-out infinite");
      } else if (effect === "diamond") {
        animations.push("diamondShimmer 1.8s ease-in-out infinite");
      } else if (effect === "rainbow") {
        animations.push("rainbowCycle 1.2s linear infinite");
      } else if (effect === "gold") {
        newImg.style.filter =
          "sepia(1) saturate(10) hue-rotate(15deg) brightness(1.3) drop-shadow(0 0 10px gold)";
      }

      if (type === "spinning") {
        animations.push("spin 1s linear infinite");
      }

      if (animations.length > 0) {
        newImg.style.animation = animations.join(", ");
      }

      if (["galaxy","godly","red","emerald","platinum","diamond"].includes(effect) || type === "spinning" || type === "large") {
        playRareSound();
      }

      newImg.style.width = size + "px";
      const maxLeft = Math.max(0, window.innerWidth  - size);
      const maxTop  = Math.max(0, window.innerHeight - size);
      newImg.style.left = (Math.random() * maxLeft) + "px";
      newImg.style.top  = (Math.random() * maxTop + window.scrollY) + "px";

      document.body.appendChild(newImg);
    }

    // ── Secret-code handler ─────────────────────────────────────────────────────
    secretInput.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      const val = secretInput.value.toLowerCase().trim();
      secretInput.value = "";

      if (val === "mylesquantiscute") {
        document.querySelectorAll("img").forEach(img => {
          img.src = (img.alt === "Cooper")
            ? "Quant and Yahu.png"
            : "Screenshot 2025-11-11 195523.png";
        });
      }

      if (val === "evilmyles") {
        document.body.innerHTML = `<div style="position:fixed;inset:0;z-index:99999;background:url('Screenshot 2025-11-11 195523.png') no-repeat center center / cover;"><div style="position:absolute;inset:0;background:rgba(180,0,0,0.55);mix-blend-mode:multiply;"></div></div>`;
      }

      if (val === "rickfilesreal") {
        const a = document.createElement("a");
        a.href = "https://www.dropbox.com/scl/fo/f585szcfx8t2zns4yb0ug/AGqOtUyluEaN7rAL6uaPQrI?rlkey=0ruf6m9f6no874f4vyrx10nrj&st=4yuer66r&dl=1";
        a.click();
      }

      if (val === "washee") {
        spawnRolledImage("Mr._Washee_Washee.webp", false, null, false);
      }

      if (val === "lucaschicken") {
        spawnRolledImage("CHICKEN-removebg-preview.png", true, null, false);
      }

      if (val === "sean murphy") {
        spawnRolledImage("sean.png", false, null, true);
      }

      if (val === "jayahk") {
        spawnRolledImage("melody.png", false, null, false);
      }

      if (val === "buttercup") {
        spawnRolledImage("buttercup.png", false, null, false, 2);
      }

      if (val === "butterspam") {
        for (let i = 0; i < 100; i++) {
          spawnRolledImage("buttercup.png", false, null, false, 1);
        }
      }

      if (val === "aaron") {
        spawnRolledImage("aaron.png", false, null, false);
      }

      if (val === "allthelovekanye") {
        const allEffects = ["galaxy","godly","emerald","platinum","diamond","rainbow","gold","normal"];
        for (const effect of allEffects) {
          const newImg = document.createElement("img");
          newImg.src = "EVANDOGREAL.JPEG";
          newImg.style.position = "absolute";
          newImg.style.zIndex = "10000";

          const effectSize = { galaxy:1800, godly:1600, emerald:900, platinum:600, diamond:550, rainbow:500, gold:650, normal:450 }[effect];
          newImg.style.width = effectSize + "px";

          const maxLeft = Math.max(0, window.innerWidth - effectSize);
          const maxTop  = Math.max(0, window.innerHeight - effectSize);
          newImg.style.left = (Math.random() * maxLeft) + "px";
          newImg.style.top  = (Math.random() * maxTop + window.scrollY) + "px";

          if (effect === "galaxy")        newImg.style.animation = "galaxyShimmer 2s ease-in-out infinite";
          else if (effect === "godly")    newImg.style.animation = "godlyShimmer 0.8s ease-in-out infinite";
          else if (effect === "emerald")  newImg.style.animation = "emeraldShimmer 1.4s ease-in-out infinite";
          else if (effect === "platinum") newImg.style.animation = "platinumShimmer 1.5s ease-in-out infinite";
          else if (effect === "diamond")  newImg.style.animation = "diamondShimmer 1.8s ease-in-out infinite";
          else if (effect === "rainbow")  newImg.style.animation = "rainbowCycle 1.2s linear infinite";
          else if (effect === "gold")     newImg.style.filter = "sepia(1) saturate(10) hue-rotate(15deg) brightness(1.3) drop-shadow(0 0 10px gold)";

          document.body.appendChild(newImg);
        }
      }

    });
  </script>
</body>
</html>
