<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Myles</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow-x: hidden;
    }
    body {
      background-color: #1a1a2e;
      background-image: url("images/55a47e7e92a6616ffefc18cf5157fcd24e55179a5bcb82884c7d28a52218ec3a24767f620d3512135169fe67f5048493a256d289e3c00d9f9efee7_1280.jpg");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }
    .canvas {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px; padding: 10px;
      width: 100%;
    }
    @media (max-width: 480px) {
      .canvas { grid-template-columns: 1fr; }
    }
    .canvas > * { aspect-ratio: 1 / 1; width: 100%; }
    .grid-img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.35);
      display: block;
    }
    #cell-bottomright { position: relative; display: flex; flex-direction: column; border-radius: 12px; }
    #dragImg {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.35);
      cursor: grab;
      position: relative;
      z-index: 10;
    }
    #dragImg.dragging {
      cursor: grabbing;
      box-shadow: 0 12px 40px rgba(0,0,0,0.55);
      position: fixed;
      z-index: 9999;
      pointer-events: none;
    }
    #secretBox {
      display: none; position: absolute; inset: 0;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(6px);
      border-radius: 12px; z-index: 5;
    }
    #secretBox.visible { display: flex; }
    #secretInput {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 10px; color: white;
      padding: 10px; width: 90%;
      text-align: center; outline: none;
      font-size: clamp(12px, 2vw, 16px);
    }

    /* Animations */
    @keyframes rainbowCycle {
      0%   { filter: hue-rotate(0deg) saturate(5) brightness(1.2) drop-shadow(0 0 15px white); }
      100% { filter: hue-rotate(360deg) saturate(5) brightness(1.2) drop-shadow(0 0 15px white); }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes platinumShimmer {
      0%, 100% { filter: grayscale(1) brightness(1.2) contrast(1.2) drop-shadow(0 0 10px #e5e4e2); }
      50%       { filter: grayscale(1) brightness(2)   contrast(1.5) drop-shadow(0 0 30px #ffffff); }
    }
    @keyframes diamondShimmer {
      0%, 100% { filter: brightness(1.3) saturate(3) hue-rotate(190deg) drop-shadow(0 0 18px #00bfff); }
      50%       { filter: brightness(2.2) saturate(5) hue-rotate(210deg) drop-shadow(0 0 45px #87d7ff); }
    }
    @keyframes emeraldShimmer {
      0%, 100% { filter: brightness(1.3) saturate(4) hue-rotate(115deg) drop-shadow(0 0 18px #00e855); }
      50%       { filter: brightness(2.4) saturate(6) hue-rotate(135deg) drop-shadow(0 0 55px #00ff66); }
    }
    @keyframes redShimmer {
      0%, 100% { filter: sepia(1) saturate(8)  hue-rotate(290deg) brightness(1.3) drop-shadow(0 0 12px #ff2200); }
      50%       { filter: sepia(1) saturate(15) hue-rotate(300deg) brightness(1.8) drop-shadow(0 0 35px #ff6644); }
    }
    @keyframes godlyShimmer {
      0%   { filter: brightness(1.4) saturate(6) hue-rotate(0deg)   drop-shadow(0 0 25px #ff00ff); }
      25%  { filter: brightness(1.8) saturate(8) hue-rotate(90deg)  drop-shadow(0 0 40px #ffff00); }
      50%  { filter: brightness(2.2) saturate(10) hue-rotate(180deg) drop-shadow(0 0 55px #00ffff); }
      75%  { filter: brightness(1.8) saturate(8) hue-rotate(270deg) drop-shadow(0 0 40px #ff8800); }
      100% { filter: brightness(1.4) saturate(6) hue-rotate(360deg) drop-shadow(0 0 25px #ff00ff); }
    }
    @keyframes galaxyShimmer {
      0%   { filter: brightness(1.5) saturate(4) hue-rotate(220deg) drop-shadow(0 0 30px #9900ff) contrast(1.3); }
      20%  { filter: brightness(2.5) saturate(7) hue-rotate(240deg) drop-shadow(0 0 60px #cc44ff) contrast(1.6); }
      40%  { filter: brightness(1.8) saturate(5) hue-rotate(200deg) drop-shadow(0 0 80px #ffffff) contrast(1.4); }
      60%  { filter: brightness(3.0) saturate(8) hue-rotate(260deg) drop-shadow(0 0 70px #4400ff) contrast(1.8); }
      80%  { filter: brightness(2.0) saturate(6) hue-rotate(230deg) drop-shadow(0 0 50px #ff44ff) contrast(1.5); }
      100% { filter: brightness(1.5) saturate(4) hue-rotate(220deg) drop-shadow(0 0 30px #9900ff) contrast(1.3); }
    }
  </style>
</head>
<body>
  <div class="canvas">
    <img class="grid-img" src="arlo.png"          alt="Arlo">
    <img class="grid-img" src="BDOGREAL.JPEG"     alt="Butterdog">
    <img class="grid-img" src="arlo.gif"          alt="Arlo gif">
    <img class="grid-img" src="BDOGS2.JPEG"       alt="B Dogs">
    <img class="grid-img" src="MADDIE.JPEG"       alt="Maddie">
    <img class="grid-img" src="CHICKEN.JPEG"      alt="Chicken">
    <img class="grid-img" src="COOPER.JPEG"       alt="Cooper">
    <img class="grid-img" src="BENCAT1.JPEG"      alt="Ben Cat 1">
    <img class="grid-img" src="BENCAT2.JPEG"      alt="Ben Cat 2">
    <img class="grid-img" src="BENDOG.JPEG"       alt="Ben Dog">
    <img class="grid-img" src="BENDOG2.png"       alt="Ben Dog 2">
    <div id="cell-bottomright">
      <div id="secretBox">
        <input id="secretInput" type="text" placeholder="enter code..." autocomplete="off" />
      </div>
      <img id="dragImg" src="EVANDOGREAL.JPEG" alt="Evan Dog">
    </div>
  </div>

  <script>
    // ── Drag logic ──────────────────────────────────────────────────────────────
    const dragImg     = document.getElementById("dragImg");
    const secretBox   = document.getElementById("secretBox");
    const secretInput = document.getElementById("secretInput");
    let isDragging = false, startX, startY;

    dragImg.addEventListener("mousedown", (e) => {
      isDragging = true;
      const rect = dragImg.getBoundingClientRect();
      startX = e.clientX - rect.left;
      startY = e.clientY - rect.top;

      dragImg.style.width  = rect.width  + "px";
      dragImg.style.height = rect.height + "px";
      dragImg.style.left   = rect.left   + "px";
      dragImg.style.top    = rect.top    + "px";

      dragImg.classList.add("dragging");
      secretBox.classList.add("visible");
      e.preventDefault();
    });

    document.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      dragImg.style.left = (e.clientX - startX) + "px";
      dragImg.style.top  = (e.clientY - startY) + "px";
    });

    document.addEventListener("mouseup", () => {
      if (!isDragging) return;
      isDragging = false;
      dragImg.style.position = "fixed";
      dragImg.classList.remove("dragging");
    });

    // ── Sound helper ────────────────────────────────────────────────────────────
    function playRareSound() {
      const audio = new Audio('https://fesliyanstudios.com');
      audio.volume = 0.5;
      audio.play().catch(() => {});
    }

    // ── Shared roll helper ───────────────────────────────────────────────────────
    function spawnRolledImage(src, isWide, blendMode, isSean) {
      const newImg = document.createElement("img");
      newImg.src = src;
      newImg.style.position = "absolute";
      newImg.style.zIndex   = "10000";

      if (blendMode) newImg.style.mixBlendMode = blendMode;

      // ── Roll 1: Visual effect ─────────────────────────────────────────────
      const galaxyChance  = 1 / 5000;
      const godlyChance   = 1 / 2500;
      const redChance     = 1 / 1500;
      const emeraldChance = 1 / 1000;
      const platChance    = 1 / 500;
      const diamondChance = 1 / 200;
      const rainbowChance = 1 / 100;
      const goldChance    = 1 / 15;

      const effectRoll = Math.random();
      let effect;
      if      (effectRoll < galaxyChance)                                                                                                    effect = "galaxy";
      else if (effectRoll < galaxyChance + godlyChance)                                                                                      effect = "godly";
      else if (isSean && effectRoll < galaxyChance + godlyChance + redChance)                                                                effect = "red";
      else if (effectRoll < galaxyChance + godlyChance + redChance + emeraldChance)                                                          effect = "emerald";
      else if (effectRoll < galaxyChance + godlyChance + redChance + emeraldChance + platChance)                                             effect = "platinum";
      else if (effectRoll < galaxyChance + godlyChance + redChance + emeraldChance + platChance + diamondChance)                             effect = "diamond";
      else if (effectRoll < galaxyChance + godlyChance + redChance + emeraldChance + platChance + diamondChance + rainbowChance)             effect = "rainbow";
      else if (effectRoll < galaxyChance + godlyChance + redChance + emeraldChance + platChance + diamondChance + rainbowChance + goldChance) effect = "gold";
      else                                                                                                                                    effect = "normal";

      // ── Roll 2: Size / motion type ────────────────────────────────────────
      const largeChance = 1 / 850;
      const spinChance  = 1 / 150;
      const typeRoll = Math.random();
      let type;
      if      (typeRoll < largeChance)                   type = "large";
      else if (typeRoll < largeChance + spinChance)      type = "spinning";
      else                                               type = "normal";

      // ── Size ──────────────────────────────────────────────────────────────
      let size;
      if (type === "large") {
        size = 3500;
      } else if (type === "spinning") {
        size = isWide ? 1400 : 800;
      } else {
        if      (effect === "galaxy")   size = isWide ? 4000 : 1200;
        else if (effect === "godly")    size = isWide ? 3200 : 1000;
        else if (effect === "red")      size = isWide ? 2400 : 800;
        else if (effect === "emerald")  size = isWide ? 2800 : 900;
        else if (effect === "platinum") size = isWide ? 2000 : 600;
        else if (effect === "diamond")  size = isWide ? 1100 : 550;
        else if (effect === "rainbow")  size = isWide ? 1000 : 500;
        else if (effect === "gold")     size = 650;
        else                            size = isWide ? 300  : 450;
      }

      // ── Apply animations ──────────────────────────────────────────────────
      const animations = [];

      if (type === "spinning") {
        animations.push("spin 1s linear infinite");
      }

      if (effect === "galaxy") {
        animations.push("galaxyShimmer 2s ease-in-out infinite");
        animations.push("spin 8s linear infinite");
      } else if (effect === "godly") {
        animations.push("godlyShimmer 0.8s ease-in-out infinite");
        animations.push("spin 4s linear infinite");
      } else if (effect === "red") {
        animations.push("redShimmer 1.5s ease-in-out infinite");
      } else if (effect === "emerald") {
        animations.push("emeraldShimmer 1.4s ease-in-out infinite");
      } else if (effect === "platinum") {
        animations.push("platinumShimmer 1.5s ease-in-out infinite");
      } else if (effect === "diamond") {
        animations.push("diamondShimmer 1.8s ease-in-out infinite");
      } else if (effect === "rainbow") {
        animations.push("rainbowCycle 1.2s linear infinite");
      } else if (effect === "gold") {
        newImg.style.filter =
          "sepia(1) saturate(10) hue-rotate(15deg) brightness(1.3) drop-shadow(0 0 10px gold)";
      }

      if (animations.length > 0) {
        newImg.style.animation = animations.join(", ");
      }

      // ── Rare sound ────────────────────────────────────────────────────────
      if (effect === "galaxy" || effect === "godly" || effect === "red" || effect === "emerald" || effect === "platinum" || effect === "diamond" || type === "spinning" || type === "large") {
        playRareSound();
      }

      // ── Position ──────────────────────────────────────────────────────────
      newImg.style.width = size + "px";
      const maxLeft = Math.max(0, window.innerWidth  - size);
      const maxTop  = Math.max(0, window.innerHeight - size);
      newImg.style.left = (Math.random() * maxLeft) + "px";
      newImg.style.top  = (Math.random() * maxTop + window.scrollY) + "px";

      document.body.appendChild(newImg);
    }

    // ── Secret-code handler ─────────────────────────────────────────────────────
    secretInput.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      const val = secretInput.value.toLowerCase().trim();
      secretInput.value = "";

      // ── Existing Easter eggs ──────────────────────────────────────────────────
      if (val === "mylesquantiscute") {
        document.querySelectorAll("img").forEach(img => {
          img.src = (img.alt === "Cooper")
            ? "Quant and Yahu.png"
            : "Screenshot 2025-11-11 195523.png";
        });
      }

      if (val === "evilmyles") {
        document.body.innerHTML = `<div style="position:fixed;inset:0;z-index:99999;background:url('Screenshot 2025-11-11 195523.png') no-repeat center center / cover;"><div style="position:absolute;inset:0;background:rgba(180,0,0,0.55);mix-blend-mode:multiply;"></div></div>`;
      }

      if (val === "rickfilesreal") {
        const a = document.createElement("a");
        a.href = "https://www.dropbox.com/scl/fo/f585szcfx8t2zns4yb0ug/AGqOtUyluEaN7rAL6uaPQrI?rlkey=0ruf6m9f6no874f4vyrx10nrj&st=4yuer66r&dl=1";
        a.click();
      }

      // ── Washee / Luca's chicken ───────────────────────────────────────────────
      if (val === "washee") {
        spawnRolledImage("Mr._Washee_Washee.webp", false, null, false);
      }

      if (val === "lucaschicken") {
        spawnRolledImage("CHICKEN-removebg-preview.png", true, null, false);
      }

      // ── Sean ──────────────────────────────────────────────────────────────────
      if (val === "sean murphy") {
        spawnRolledImage("sean.png", false, null, true);
      }

      // ── Melody ────────────────────────────────────────────────────────────────
      if (val === "jayahk") {
        spawnRolledImage("melody.png", false, null, false);
      }

      // ── Buttercup ─────────────────────────────────────────────────────────────
      if (val === "buttercup") {
        spawnRolledImage("BUTTERDOG.JPEG", false, "multiply", false);
      }

      // ── Eren ──────────────────────────────────────────────────────────────────
      if (val === "eren") {
        spawnRolledImage("erin.JPEG", false, "multiply", false);
      }

    });
  </script>
</body>
</html>
